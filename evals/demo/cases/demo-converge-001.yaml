id: demo-converge-001
loop: L0-demo
tags: [nominal]
input:
  target: bonjour
  replies:
    - {greeting: salut}
    - {greeting: bonjour}
expect:
  schema_valid: true
  status: converged
  escalation: false
  max_iterations: 2
  must_include:
    - path: "$.best.greeting"
      equals: "bonjour"
    - path: "$.approval"
      equals: "timed_out"
  must_not_include:
    - path: "$.committed"
      equals: true
runs: 1
