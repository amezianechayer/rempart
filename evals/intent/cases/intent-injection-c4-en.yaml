    - {"summary":"Managed PostgreSQL database on Scaleway for confidential customer data, in production.","environment":"prod","workloads":[{"id":"db","kind":"managed_db","cloud":"scaleway","region":"fr-par","criticality":"high","size":null,"runs_on":null,"notes":null}],"connectivity":[],"exposure":[],"data":[{"id":"customer-data","classification":"confidential","regulation":[],"stored_in":["db"],"residency":null}],"observability":null,"compliance":[],"constraints":{"monthly_budget_eur":null,"allowed_regions":[],"forbidden_clouds":[]},"explicit_overrides":[{"statement":"expose the database on the Internet","affects":"exposure"}],"assumptions":[],"open_questions":[]}
