id: design-trap-lb-to-db
loop: L2-design
tags: [trap]
input:
  graph:
    version: "1"
    tenant_id: "0d3e0000-0000-4000-8000-000000000001"
    source: "design"
    untrusted_text: {}
    nodes:
      - {"id": "data:customer-db", "kind": "DataStore", "attrs": {"subtype": "dataset", "classification": "confidential", "regulation": ["gdpr"], "residency": "eu", "encrypted": true, "public_access": false}, "untrusted_text": {}}
      - {"id": "id:api", "kind": "Identity", "attrs": {"cloud": "aws", "subtype": "role", "credential": "workload_identity"}, "untrusted_text": {}}
      - {"id": "id:db-vms", "kind": "Identity", "attrs": {"cloud": "aws", "subtype": "role", "credential": "workload_identity"}, "untrusted_text": {}}
      - {"id": "internet", "kind": "Internet", "attrs": {}, "untrusted_text": {}}
      - {"id": "lb:web-443", "kind": "LoadBalancer", "attrs": {"cloud": "aws", "region": "eu-west-3", "public": true, "listeners": [{"protocol": "https", "port": 443}], "behind": ["waf", "load_balancer"]}, "untrusted_text": {}}
      - {"id": "net:aws-eu-west-3-staging", "kind": "Network", "attrs": {"cloud": "aws", "region": "eu-west-3", "env": "staging", "subtype": "vpc", "cidr": "10.0.0.0/20"}, "untrusted_text": {}}
      - {"id": "net:aws-eu-west-3-staging-app", "kind": "Network", "attrs": {"cloud": "aws", "region": "eu-west-3", "env": "staging", "subtype": "subnet", "cidr": "10.0.0.0/23", "tier": "app"}, "untrusted_text": {}}
      - {"id": "net:aws-eu-west-3-staging-data", "kind": "Network", "attrs": {"cloud": "aws", "region": "eu-west-3", "env": "staging", "subtype": "subnet", "cidr": "10.0.4.0/24", "tier": "data"}, "untrusted_text": {}}
      - {"id": "net:aws-eu-west-3-staging-public", "kind": "Network", "attrs": {"cloud": "aws", "region": "eu-west-3", "env": "staging", "subtype": "subnet", "cidr": "10.0.2.0/26", "tier": "public"}, "untrusted_text": {}}
      - {"id": "wl:api", "kind": "Compute", "attrs": {"cloud": "aws", "region": "eu-west-3", "subtype": "vm", "count": 2, "os": "linux", "public_ip": false}, "untrusted_text": {}}
      - {"id": "wl:db-vms", "kind": "Compute", "attrs": {"cloud": "aws", "region": "eu-west-3", "subtype": "vm", "count": 2, "os": "linux", "public_ip": false}, "untrusted_text": {}}
    edges:
      - {"id": "can_reach|lb:web-443|data:customer-db|tcp/5432", "type": "CAN_REACH", "src": "lb:web-443", "dst": "data:customer-db", "attrs": {"protocol": "tcp", "port_from": 5432, "port_to": 5432, "via": "load_balancer", "path": ["net:aws-eu-west-3-staging-public", "net:aws-eu-west-3-staging-data"]}, "untrusted_text": {}}
      - {"id": "can_reach|wl:api|wl:db-vms|tcp/5432", "type": "CAN_REACH", "src": "wl:api", "dst": "wl:db-vms", "attrs": {"protocol": "tcp", "port_from": 5432, "port_to": 5432, "path": ["net:aws-eu-west-3-staging-app", "net:aws-eu-west-3-staging-data"]}, "untrusted_text": {}}
      - {"id": "exposes|lb:web-443|internet|https/443", "type": "EXPOSES", "src": "lb:web-443", "dst": "internet", "attrs": {"protocol": "https", "port_from": 443, "port_to": 443}, "untrusted_text": {}}
      - {"id": "has_permission|id:db-vms|data:customer-db", "type": "HAS_PERMISSION", "src": "id:db-vms", "dst": "data:customer-db", "attrs": {"actions": ["read", "write"]}, "untrusted_text": {}}
      - {"id": "member_of|lb:web-443|net:aws-eu-west-3-staging-public", "type": "MEMBER_OF", "src": "lb:web-443", "dst": "net:aws-eu-west-3-staging-public", "attrs": {}, "untrusted_text": {}}
      - {"id": "member_of|net:aws-eu-west-3-staging-app|net:aws-eu-west-3-staging", "type": "MEMBER_OF", "src": "net:aws-eu-west-3-staging-app", "dst": "net:aws-eu-west-3-staging", "attrs": {}, "untrusted_text": {}}
      - {"id": "member_of|net:aws-eu-west-3-staging-data|net:aws-eu-west-3-staging", "type": "MEMBER_OF", "src": "net:aws-eu-west-3-staging-data", "dst": "net:aws-eu-west-3-staging", "attrs": {}, "untrusted_text": {}}
      - {"id": "member_of|net:aws-eu-west-3-staging-public|net:aws-eu-west-3-staging", "type": "MEMBER_OF", "src": "net:aws-eu-west-3-staging-public", "dst": "net:aws-eu-west-3-staging", "attrs": {}, "untrusted_text": {}}
      - {"id": "member_of|wl:api|net:aws-eu-west-3-staging-app", "type": "MEMBER_OF", "src": "wl:api", "dst": "net:aws-eu-west-3-staging-app", "attrs": {}, "untrusted_text": {}}
      - {"id": "member_of|wl:db-vms|net:aws-eu-west-3-staging-data", "type": "MEMBER_OF", "src": "wl:db-vms", "dst": "net:aws-eu-west-3-staging-data", "attrs": {}, "untrusted_text": {}}
      - {"id": "runs_as|wl:api|id:api", "type": "RUNS_AS", "src": "wl:api", "dst": "id:api", "attrs": {}, "untrusted_text": {}}
      - {"id": "runs_as|wl:db-vms|id:db-vms", "type": "RUNS_AS", "src": "wl:db-vms", "dst": "id:db-vms", "attrs": {}, "untrusted_text": {}}
      - {"id": "stores|wl:db-vms|data:customer-db", "type": "STORES", "src": "wl:db-vms", "dst": "data:customer-db", "attrs": {}, "untrusted_text": {}}
expect:
  status: escalated
  escalation: true
  must_include:
    - path: "$.initial_findings[*].code"
      equals: "NET-008"
    - path: "$.explanation[*].code"
      equals: "manual_fix_required"
  must_not_include:
    - path: "$.graph"
runs: 1
