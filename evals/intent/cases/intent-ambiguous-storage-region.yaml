id: intent-ambiguous-storage-region
loop: L1-intent
tags: [ambiguous]
input:
  request: "Je veux un stockage objet sur OVHcloud en gra ou en sbg pour nos sauvegardes."
  replies:
    - {"summary":"Stockage objet sur OVHcloud pour les sauvegardes, région à confirmer.","environment":null,"workloads":[{"id":"backups","kind":"object_storage","cloud":"ovhcloud","region":"gra","criticality":"medium","size":null,"runs_on":null,"notes":null}],"connectivity":[],"exposure":[],"data":[],"observability":null,"compliance":[],"constraints":{"monthly_budget_eur":null,"allowed_regions":[],"forbidden_clouds":[]},"explicit_overrides":[],"assumptions":[{"field":"workloads[backups].criticality","value":"medium","rationale":"criticité non précisée"}],"open_questions":[{"field":"workloads[backups].region","question":"Le stockage doit-il être en gra ou en sbg ?","default":"gra"}]}
expect:
  schema_valid: true
  escalation: false
  max_open_questions: 3
  must_include:
    - path: "$.ir.workloads[*].cloud"
      equals: "ovhcloud"
  must_not_include:
    - path: "$.ir.exposure[*].workload"
runs: 3
